<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letra a letra | CEIP Manuel Siurot</title>
<meta name="theme-color" content="#F3F7FC">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Letra a letra">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Playwrite+ES:wght@100..400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F7FC; --rule:#D3E3F4; --rule2:#8DB5DF; --margin:#F1A9AE;
  --ink:#1B3A7A; --ink-d:#0F244F; --red:#D7263D; --graphite:#26303F; --soft:#5C6B80;
  --sun:#FFC21A; --sun-d:#B98500; --leaf:#239B56; --leaf-l:#DDF5E6; --bad-l:#FDE3E6; --white:#fff;
  --lig:"Playwrite ES","Segoe Script","Comic Sans MS",cursive;
  --ui:"Andika","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--ui);color:var(--graphite);background:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-size:18px;line-height:1.4}
@media (min-width:760px){
  body{background-image:linear-gradient(90deg,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),
    repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px)}
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.lig{font-family:var(--lig);text-transform:var(--ltt,none);font-weight:400}
/* tipo de letra: ligada (por defecto), imprenta o mayúsculas */
body.f-imp,body.f-may{--lig:"Andika","Trebuchet MS",system-ui,sans-serif}
body.f-may{--ltt:uppercase}
.hidden{display:none!important}

/* ---------- pantallas ---------- */
.screen{display:none;min-height:calc(100vh - 64px);flex-direction:column}
.foot{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;min-height:64px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  border-top:2px solid var(--rule2);background:rgba(243,247,252,.95);color:var(--soft);font-size:.9rem;text-align:center}
.foot img{height:34px;width:auto}
.foot b{color:var(--ink)}
.school{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:4px}
.school img{height:clamp(70px,16vw,110px);width:auto}
.school span{font-weight:700;color:var(--ink);letter-spacing:.06em;text-transform:uppercase;font-size:.95rem}
.sol-pop{position:fixed;inset:0;display:grid;place-items:center;z-index:45;pointer-events:none;background:rgba(15,36,79,.18)}
.sol{background:#fff;border:4px solid var(--leaf);box-shadow:0 7px 0 var(--leaf);border-radius:28px;padding:14px 34px;display:flex;flex-direction:column;align-items:center;gap:2px;
  animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;max-width:90vw}
.sol .se{font-size:clamp(4rem,16vw,6rem);line-height:1.1}
.sol .ses{font-weight:700;color:var(--ink);font-size:clamp(2rem,8vw,3rem)}
.screen.on{display:flex}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:rgba(243,247,252,.94);backdrop-filter:blur(6px);border-bottom:2px solid var(--rule2)}
.bar .grow{flex:1;min-width:0}
.bar h2{margin:0;font-size:1.15rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:52px;height:52px;flex:0 0 52px;border-radius:50%;border:3px solid var(--ink);background:#fff;
  font-size:1.5rem;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);padding:0}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ib.sun{background:var(--sun);border-color:var(--sun-d);box-shadow:0 3px 0 var(--sun-d)}
.main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:18px 16px 40px}
@media (min-width:760px){.main{padding-left:64px}}

.btn{font-weight:700;font-size:1.05rem;padding:12px 20px;border-radius:16px;border:3px solid var(--ink);
  background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);min-height:52px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--ink);color:#fff;box-shadow:0 4px 0 var(--ink-d);border-color:var(--ink-d)}
.btn.sun{background:var(--sun);color:#3F2E00;border-color:var(--sun-d);box-shadow:0 4px 0 var(--sun-d)}
.btn.danger{color:var(--red);border-color:var(--red);box-shadow:0 4px 0 var(--red)}
.btn.small{font-size:.92rem;padding:7px 12px;min-height:40px;border-radius:12px;box-shadow:0 3px 0 currentColor}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}

/* ---------- portada ---------- */
.hero{text-align:center;padding:26px 0 8px}
.hero h1{margin:0;font-family:var(--lig);text-transform:var(--ltt,none);font-weight:400;color:var(--ink);font-size:clamp(2.6rem,9vw,4.6rem);line-height:1.9}
.hero h1 .inkline{display:inline-block;animation:write 2.2s cubic-bezier(.5,0,.3,1) both}
.hero p{margin:0;color:var(--soft);font-size:1.15rem}
@keyframes write{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -5% -20% 0)}}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:16px;margin-top:24px}
.who{background:#fff;border:3px solid var(--rule2);border-radius:22px;padding:14px 8px 12px;display:flex;flex-direction:column;
  align-items:center;gap:6px;box-shadow:0 5px 0 var(--rule2);min-height:150px}
.who:active{transform:translateY(3px);box-shadow:0 2px 0 var(--rule2)}
.who .av{font-size:3.4rem;line-height:1.15}
.who .nm{font-weight:700;font-size:1.1rem;color:var(--ink);text-align:center;word-break:break-word}
.who .st{font-size:.85rem;color:var(--soft)}
.who.class{border-color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.who.add{border-style:dashed;background:transparent;box-shadow:none;justify-content:center;color:var(--soft)}
.teacher-link{position:fixed;right:14px;top:14px;z-index:6}

.start-btn{font:700 clamp(1.6rem,6vw,2.3rem) var(--ui);padding:18px 44px;border-radius:30px;border:4px solid var(--sun-d);background:var(--sun);color:#3F2E00;
  box-shadow:0 7px 0 var(--sun-d);animation:pulse 2s ease-in-out infinite}
.start-btn:active{transform:translateY(4px);box-shadow:0 3px 0 var(--sun-d)}
/* ---------- mapa de letras ---------- */
.map-h{display:flex;align-items:center;gap:12px;margin:26px 0 14px;color:var(--ink);font-size:1.25rem}
.map-h:first-child{margin-top:4px}
.map-h::after{content:"";flex:1;height:3px;border-radius:3px;background:var(--rule2)}
.stars-pill{background:#fff;border:3px solid var(--sun-d);border-radius:30px;padding:6px 14px;font-weight:700;color:#5b4300;white-space:nowrap}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px}
.tile{position:relative;aspect-ratio:1/1.05;background:#fff;border:3px solid var(--ink);border-radius:20px;
  box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.tile .lt{font-family:var(--lig);text-transform:var(--ltt,none);color:var(--red);font-size:2.3rem;line-height:1.7;white-space:nowrap}
.tile .lt.long{font-size:1.45rem}
.tile .ss{font-size:.95rem;letter-spacing:1px;min-height:1.2em;color:var(--sun-d)}
.tile.locked{border-color:#B7C4D6;box-shadow:0 5px 0 #B7C4D6;background:#EEF2F8}
.tile.locked .lt{color:#A5B2C4}
.tile.locked::after{content:"🔒";position:absolute;right:6px;top:4px;font-size:1.1rem}
.tile.current{border-color:var(--sun-d);box-shadow:0 5px 0 var(--sun-d);background:#FFF6D6}
.tile.current::after{content:"";position:absolute;inset:-9px;border-radius:26px;border:3px dashed var(--sun);animation:spin 14s linear infinite}
.tile.done::before{content:"✓";position:absolute;left:8px;top:4px;color:var(--leaf);font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- lección ---------- */
.lesson-hero{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;background:#fff;border:3px solid var(--rule2);
  border-radius:26px;padding:10px 20px;box-shadow:0 5px 0 var(--rule2)}
.big-letter{font-family:var(--lig);text-transform:var(--ltt,none);color:var(--red);font-size:clamp(4rem,16vw,7.5rem);line-height:1.75;background:none;border:0;padding:0 8px}
.big-letter .up{color:var(--ink)}
.write-in{display:inline-block;animation:write 1.6s cubic-bezier(.5,0,.3,1) both}
.key-card{display:flex;flex-direction:column;align-items:center;background:var(--paper);border:3px dashed var(--rule2);border-radius:22px;padding:10px 18px}
.key-card .em{font-size:4.2rem;line-height:1.1}
.key-card .kw{font-family:var(--lig);text-transform:var(--ltt,none);color:var(--ink);font-size:1.6rem;line-height:1.8}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:22px}
.act{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:14px 8px;display:flex;
  flex-direction:column;align-items:center;gap:4px;min-height:136px;justify-content:center}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.act .ic{font-size:2.6rem;line-height:1.1}
.act .lb{font-weight:700;color:var(--ink);text-align:center;font-size:1rem}
.act .ss{color:var(--sun-d);letter-spacing:2px;min-height:1.2em}
.act.done{background:#F6FBF7;border-color:var(--leaf);box-shadow:0 5px 0 var(--leaf)}

/* ---------- actividades ---------- */
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--rule2)}
.dots i.on{background:var(--sun);border-color:var(--sun-d)}
.dots i.now{background:var(--ink);border-color:var(--ink)}
.stage{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:8px}
.prompt{font-size:1.15rem;color:var(--soft);text-align:center;margin:0}
.pic{font-size:clamp(88px,24vw,150px);line-height:1.05;background:none;border:0;padding:0}
.say{width:100px;height:100px;border-radius:50%;background:var(--sun);border:4px solid var(--sun-d);box-shadow:0 5px 0 var(--sun-d);font-size:2.8rem}
.say:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-d)}
.say.sm{width:64px;height:64px;font-size:1.7rem;border-width:3px;box-shadow:0 4px 0 var(--sun-d)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(600px,100%)}
.opts.five{grid-template-columns:repeat(5,minmax(0,1fr));width:min(720px,100%)}
@media (max-width:520px){.opts.five{grid-template-columns:repeat(3,minmax(0,1fr))}}
.opt{background:#fff;border:3px solid var(--rule2);border-radius:20px;box-shadow:0 5px 0 var(--rule2);min-height:112px;
  font-family:var(--lig);text-transform:var(--ltt,none);font-size:clamp(2rem,7vw,3.2rem);line-height:1.6;color:var(--ink);padding:4px 6px;display:grid;place-items:center}
.opt.emo{font-family:var(--ui);font-size:clamp(3.2rem,12vw,5rem);line-height:1.1}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--rule2)}
.opt.ok{background:var(--leaf-l);border-color:var(--leaf);box-shadow:0 5px 0 var(--leaf)}
.opt.bad{background:var(--bad-l);border-color:var(--red);box-shadow:0 5px 0 var(--red);animation:shake .45s}
.opt.hint{border-color:var(--sun-d);box-shadow:0 5px 0 var(--sun-d);animation:pulse 1s ease-in-out infinite}
.opt:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pulse{50%{transform:scale(1.06)}}
.word-show{font-family:var(--lig);text-transform:var(--ltt,none);color:var(--ink);font-size:clamp(2.6rem,11vw,4.8rem);line-height:1.8;text-align:center}
.word-show .nl{color:var(--red)}
.blank{display:inline-block;min-width:.9em;border-bottom:5px solid var(--sun-d);color:var(--leaf)}

/* sílabas para escuchar en "Conoce" */
.syl-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.syl{min-width:92px;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);
  font-family:var(--lig);text-transform:var(--ltt,none);font-size:2.2rem;line-height:1.7;color:var(--ink);padding:0 12px;position:relative}
.syl .nl{color:var(--red)}
.syl.heard{border-color:var(--leaf);box-shadow:0 4px 0 var(--leaf)}
.syl.heard::after{content:"✓";position:absolute;right:6px;top:0;font:700 1rem var(--ui);color:var(--leaf)}
.syl.inv{font-size:1.7rem;min-width:76px;border-color:var(--rule2);box-shadow:0 4px 0 var(--rule2)}

/* recorrido guiado de «Conoce la letra» */
.big-letter,.key-card{position:relative;border-radius:22px}
.big-letter.up-b .up{color:var(--ink)}
.big-letter.heard,.key-card.heard{background:var(--leaf-l)}
.next{animation:glow 1.3s ease-in-out infinite;z-index:2}
.next::after{content:"👆";position:absolute;right:-8px;bottom:-30px;font-size:2.2rem;animation:tapHint 1.3s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.syl.next::after{right:-18px;bottom:-36px;font:2.2rem var(--ui);color:inherit}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,194,26,.9)}50%{box-shadow:0 0 0 12px rgba(255,194,26,0)}}
@keyframes tapHint{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,-8px)}}
.syl.join .plus{display:inline-block;max-width:1.2em;opacity:1;color:var(--sun-d);font-family:var(--ui);font-size:.7em;margin:0 .15em;transition:max-width .35s,opacity .3s,margin .35s;overflow:hidden;vertical-align:middle}
.syl.join.joined .plus{max-width:0;opacity:0;margin:0}
.syl.join .v{color:var(--ink)}
.done-banner{background:var(--leaf-l);border:4px solid var(--leaf);box-shadow:0 6px 0 var(--leaf);border-radius:24px;padding:14px 24px;font-weight:700;
  color:#155c33;font-size:1.4rem;text-align:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
/* trazado */
.trace{width:min(760px,100%);background:#fff;border:3px solid var(--rule2);border-radius:22px;overflow:hidden;box-shadow:0 5px 0 var(--rule2)}
.trace canvas{display:block;touch-action:none;cursor:crosshair}

/* caza letras */
.hunt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(640px,100%)}
@media (max-width:480px){.hunt{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hunt .opt{min-height:96px;font-size:clamp(1.8rem,7vw,2.8rem)}

/* formar palabra */
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:100px}
.slot{min-width:84px;min-height:96px;border:3px dashed var(--rule2);border-radius:18px;background:rgba(255,255,255,.7);
  font-family:var(--lig);text-transform:var(--ltt,none);font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.6;color:var(--ink);padding:0 10px}
.slot.full{border-style:solid;border-color:var(--ink);background:#fff}
.slot.bad{border-color:var(--red);background:var(--bad-l);animation:shake .45s}
.slot.ok{border-color:var(--leaf);background:var(--leaf-l)}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(720px,100%)}
.tiles .opt{min-height:88px;min-width:84px;font-size:clamp(1.8rem,6vw,2.6rem);padding:0 14px}
.tiles .opt.used{visibility:hidden}

/* ---------- cartilla ---------- */
.book-tools{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.page{position:relative;background:#fff;border-radius:6px 20px 20px 6px;box-shadow:0 2px 0 #cdd9e8,0 10px 24px rgba(27,58,122,.12);
  padding:22px 22px 30px 34px;max-width:860px;margin:0 auto;
  background-image:linear-gradient(90deg,transparent 18px,var(--margin) 18px,var(--margin) 20px,transparent 20px),
  repeating-linear-gradient(to bottom,transparent 0 47px,#E3ECF7 47px 48px)}
.page h3{margin:18px 0 6px;font-size:1rem;color:var(--soft);font-weight:700}
.page .ph{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.page .ph .big-letter{font-size:clamp(3.6rem,13vw,6rem)}
.page .ph .em{font-size:4rem}
.page .num{position:absolute;right:18px;top:10px;color:var(--soft);font-size:.9rem}
.c-syl{font-size:calc(2.3rem * var(--bs,1));display:flex;gap:14px 26px;flex-wrap:wrap;font-family:var(--lig);text-transform:var(--ltt,none);color:var(--ink);line-height:1.9}
.c-syl button{background:none;border:0;padding:0 4px;border-radius:10px;font:inherit;color:inherit}
.c-syl button:active,.c-syl button.reading{background:#FFF2BF}
.c-words{font-size:calc(1.9rem * var(--bs,1));display:flex;flex-wrap:wrap;gap:6px 30px;font-family:var(--lig);text-transform:var(--ltt,none);color:var(--ink);line-height:1.9}
.c-words button{background:none;border:0;padding:0 4px;border-radius:10px;font:inherit;color:inherit}
.c-words button.reading{background:#FFF2BF}
.nl{color:var(--red)}
.sy1{color:var(--ink)} .sy2{color:#7B3FA0}
.c-sent{display:flex;align-items:flex-start;gap:10px;margin:6px 0}
.c-sent .txt{font-size:calc(1.6rem * var(--bs,1));font-family:var(--lig);text-transform:var(--ltt,none);color:var(--ink);line-height:2}
.c-sent .txt span{border-radius:8px;padding:0 2px}
.c-sent .txt span.reading{background:#FFF2BF}
.c-sent .ctrl{display:flex;gap:6px;flex:0 0 auto;padding-top:6px}
.mini{width:44px;height:44px;border-radius:50%;border:3px solid var(--rule2);background:#fff;font-size:1.2rem;display:grid;place-items:center;padding:0}
.mini:active{transform:translateY(2px)}
.mini[data-r]{color:var(--red);border-color:var(--red)}
.empty{color:var(--soft);font-style:italic}

/* ---------- resultados ---------- */
.result{text-align:center;padding-top:30px}
.result .stars{font-size:clamp(4rem,16vw,6.5rem);letter-spacing:6px;margin:10px 0}
.result .stars span{display:inline-block;opacity:.18;filter:grayscale(1)}
.result .stars span.on{opacity:1;filter:none;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.result .stars span.on:nth-child(2){animation-delay:.35s}
.result .stars span.on:nth-child(3){animation-delay:.7s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.result h2{font-family:var(--lig);text-transform:var(--ltt,none);font-weight:400;color:var(--ink);font-size:clamp(2rem,7vw,3rem);line-height:1.8;margin:0}
.unlock{margin:10px auto 0;max-width:420px;background:#FFF6D6;border:3px solid var(--sun-d);border-radius:20px;padding:10px 16px;font-weight:700;color:#5b4300}
.burst{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.burst span{position:absolute;top:-40px;font-size:2rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* ---------- modal y aviso ---------- */
.modal-back{position:fixed;inset:0;background:rgba(15,36,79,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:24px;border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink-d);width:min(520px,100%);max-height:90vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 10px;color:var(--ink);font-size:1.3rem}
.modal .mbody{margin-bottom:16px}
.modal .row{justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.field label{font-weight:700;color:var(--ink);font-size:.95rem}
.field input,.field select,.field textarea{font:inherit;padding:10px 12px;border:3px solid var(--rule2);border-radius:12px;background:#fff;color:var(--graphite)}
.field textarea{min-height:160px}
.av-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.av-pick button{font-size:2rem;background:#fff;border:3px solid var(--rule);border-radius:14px;padding:4px}
.av-pick button.sel{border-color:var(--ink);background:#E8F0FB}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin-top:10px}
.pinpad button{height:62px;border-radius:16px;border:3px solid var(--ink);background:#fff;font-size:1.5rem;font-weight:700;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.pindots{display:flex;gap:12px;justify-content:center;margin:6px 0}
.pindots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink)}
.pindots i.on{background:var(--ink)}
.snd-btn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;width:54px;height:54px;border-radius:50%;
  border:3px solid var(--ink);background:#fff;font-size:1.55rem;display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--ink)}
.snd-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.snd-btn.off{background:#FDE3E6;border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.main{padding-bottom:84px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:16px;
  font-weight:700;z-index:60;box-shadow:0 5px 0 var(--ink-d);max-width:90vw;text-align:center}

.rec-badge{font-size:.8rem;background:#E3F5F0;color:#0E6B5A;border-radius:10px;padding:0 6px;font-weight:700}

/* ---------- repaso y álbum ---------- */
.map-top{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:2px 0 4px}
.map-top .btn{font-size:1.1rem}
.alb-n{font-size:.85rem;color:var(--soft);margin-left:4px;font-weight:700}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:16px}
.stk{aspect-ratio:1/1.1;border-radius:22px;border:3px dashed #B7C4D6;background:#EEF2F8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.stk .se{font-size:3rem;line-height:1.1;filter:grayscale(1);opacity:.3}
.stk .sl{font-family:var(--lig);text-transform:var(--ltt,none);color:#A5B2C4;font-size:1.6rem;line-height:1.6}
.stk.got{border:3px solid var(--sun-d);background:#FFF6D6;box-shadow:0 5px 0 var(--sun-d);transform:rotate(-2deg)}
.stk.got:nth-child(even){transform:rotate(2deg)}
.stk.got .se{filter:none;opacity:1}
.stk.got .sl{color:var(--red)}
.newstk{margin:14px auto 0;max-width:440px;background:#FFF6D6;border:3px solid var(--sun-d);border-radius:22px;padding:10px 16px;font-weight:700;color:#5b4300;display:flex;flex-direction:column;align-items:center;gap:6px}
.stk{position:relative}
.stk.got.m1{border:4px solid #B8733A;box-shadow:0 5px 0 #8C5523;background:#FBEBDD}
.stk.got.m2{border:4px solid #9AA4AE;box-shadow:0 5px 0 #6F7880;background:#F1F4F7}
.stk.got.m3{border:4px solid #E0A800;box-shadow:0 5px 0 #B98500,0 0 0 3px #FFE58A inset;background:linear-gradient(145deg,#FFF9DF,#FFE9A3)}
.stk .st{font-size:1rem;letter-spacing:1px;color:#E0A800;min-height:1.1em;line-height:1}
.stk .st .off{color:#C9D2DE}
.stk .md{font-size:.72rem;font-weight:700;letter-spacing:.04em;color:var(--soft)}
.stk.m1 .md{color:#8C5523}.stk.m2 .md{color:#5E666D}.stk.m3 .md{color:#8A6400}
.newstk.m1{background:#FBEBDD;border-color:#B8733A}.newstk.m2{background:#F1F4F7;border-color:#9AA4AE}
.newstk .st{font-size:1.4rem;letter-spacing:2px;color:#E0A800}.newstk .st .off{color:#C9D2DE}
.newstk .tip{font-weight:400;font-size:.95rem;text-align:center}
.tile .ss .prog{color:var(--soft);font-size:.8rem;letter-spacing:0;font-weight:700}
.tile .ss .off{color:#D5DCE6}
.tbl .off{color:#D5DCE6}
.newstk .se{font-size:4rem;line-height:1.1;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
.dots .rv{font-weight:700;color:var(--sun-d);margin-right:8px;font-size:.95rem;align-self:center}
/* ---------- leo y comprendo, ordeno la frase ---------- */
.sent-show{background:#fff;border:3px solid var(--rule2);border-radius:20px;box-shadow:0 5px 0 var(--rule2);font-family:var(--lig);text-transform:var(--ltt,none);
  font-size:clamp(1.6rem,6vw,2.6rem);line-height:1.8;color:var(--ink);padding:6px 22px;max-width:100%}
.sent-opts{display:grid;gap:12px;width:min(680px,100%)}
.sent-opts .opt{font-size:clamp(1.3rem,4.6vw,1.9rem);min-height:76px;line-height:1.7;padding:6px 14px}
.slots.words .slot,.tiles.words .opt{min-width:64px;font-size:clamp(1.5rem,5vw,2.2rem)}
/* ---------- grabarse leyendo ---------- */
.mini.recording{background:#FDE3E6;border-color:var(--red);animation:pulse 1s ease-in-out infinite}
.hint{color:var(--soft);font-size:.95rem;margin:0 0 6px}
/* ---------- tipo de letra (panel) ---------- */
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fopt{border:3px solid var(--rule2);border-radius:18px;background:#fff;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;box-shadow:0 4px 0 var(--rule2)}
.fopt .fs{font-size:1.7rem;line-height:1.8;color:var(--ink)}
.fopt .fn{font-weight:700;color:var(--soft)}
.fopt.on{border-color:var(--ink);box-shadow:0 4px 0 var(--ink);background:#E8F0FB}
.fopt.on .fn{color:var(--ink)}

/* ---------- panel del maestro ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:3px solid var(--rule2);background:#fff;border-radius:14px;padding:8px 14px;font-weight:700;color:var(--soft)}
.tabs button.on{border-color:var(--ink);color:var(--ink);background:#E8F0FB}
.card{background:#fff;border:3px solid var(--rule2);border-radius:20px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 8px;color:var(--ink)}
.card p{margin:4px 0 10px;color:var(--soft);font-size:.95rem}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:2px solid var(--rule)}
.tbl th{color:var(--soft);font-weight:700}
.tbl-wrap{overflow-x:auto}
.ord{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ord li{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--rule);border-radius:14px;padding:6px 10px}
.ord .n{width:28px;color:var(--soft);font-weight:700}
.ord .l{font-family:var(--lig);text-transform:var(--ltt,none);color:var(--red);font-size:1.5rem;line-height:1.7;min-width:90px}
.ord .info{flex:1;color:var(--soft);font-size:.88rem}
.ord .mini{width:40px;height:40px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>

/* ================== MOTOR DE TEXTO ================== */
const ACC = {'á':'a','é':'e','í':'i','ó':'o','ú':'u'};
const plain = s => s.toLowerCase().replace(/[áéíóú]/g, c => ACC[c]);
const isV = c => 'aeiouáéíóú'.includes(c);
const CL_L = ['p','b','c','f','g','k'], CL_R = ['p','b','c','d','f','g','k','t'];

function tokenize(word){
  const s = word, lw = word.toLowerCase(), out = [];
  let i = 0;
  while (i < lw.length){
    const c = lw[i], n = lw[i+1] || '', n2 = lw[i+2] || '';
    if (!/[a-zñáéíóúü]/.test(c)){ i++; continue; }
    let t = 1, k, v = false;
    const prev = out[out.length-1];
    if (isV(c)){ k = ACC[c] || c; v = true; }
    else if (c==='c' && n==='h'){ t=2; k='ch'; }
    else if (c==='l' && n==='l'){ t=2; k='ll'; }
    else if (c==='r' && n==='r'){ t=2; k='rr'; }
    else if (c==='q' && n==='u'){ t=2; k='qu'; }
    else if (c==='g' && n==='ü'){ t=2; k='gü'; }
    else if (c==='g' && n==='u' && 'eiéí'.includes(n2)){ t=2; k='g'; }
    else if (c==='c' && 'eiéí'.includes(n)){ k='ce'; }
    else if (c==='g' && 'eiéí'.includes(n)){ k='ge'; }
    else if (c==='y'){ k='y'; v = !(n && isV(n)); }
    else if (c==='l' && prev && !prev.v && CL_L.includes(prev.raw) && isV(n)){ k='TL'; }
    else if (c==='r' && prev && !prev.v && CL_R.includes(prev.raw) && isV(n)){ k='TR'; }
    else if (c==='r'){ k = (!prev || ['n','l','s'].includes(prev.raw)) ? 'rr' : 'r'; }
    else if (c==='ü'){ k='ü'; v=true; }
    else k = c;
    out.push({t: s.substr(i,t), raw: lw.substr(i,t), k, v});
    i += t;
  }
  return out;
}

function syllabify(word){
  const u = tokenize(word);
  if (!u.length) return [{t:word,k:[],a:0,b:0}];
  const strong = x => /[aeoáéóíú]/.test(x.raw);
  const nuc = []; let i = 0;
  while (i < u.length){
    if (u[i].v){ let j = i; while (j+1 < u.length && u[j+1].v && !(strong(u[j]) && strong(u[j+1]))) j++; nuc.push([i,j]); i = j+1; }
    else i++;
  }
  const mk = (a,b) => ({t: u.slice(a,b).map(x=>x.t).join(''), k: u.slice(a,b).map(x=>x.k), a, b});
  if (nuc.length <= 1) return [mk(0,u.length)];
  const cl = a => u[a+1] && (u[a+1].k==='TL' || u[a+1].k==='TR');
  const cuts = [];
  for (let n = 0; n < nuc.length-1; n++){
    const e1 = nuc[n][1], s2 = nuc[n+1][0], c = s2-e1-1;
    let cut;
    if (c <= 0) cut = s2;
    else if (c === 1) cut = e1+1;
    else if (c === 2) cut = cl(e1+1) ? e1+1 : e1+2;
    else if (c === 3) cut = cl(e1+2) ? e1+2 : e1+3;
    else cut = e1+3;
    cuts.push(cut);
  }
  const res = []; let a = 0;
  cuts.forEach(c => { res.push(mk(a,c)); a = c; });
  res.push(mk(a,u.length));
  return res;
}

function memo(key, fn){ return cache[key] || (cache[key] = fn()); }
const knownAt = i => memo('k'+i, () => { const s = new Set(); order().slice(0, i+1).forEach(l => l.keys.forEach(k => s.add(k))); return s; });
const wordsFor = i => memo('w'+i, () => { const kn = knownAt(i), cur = new Set(lessonAt(i).keys); return WORDS.filter(w => w.keys.every(k => kn.has(k)) && w.keys.some(k => cur.has(k))); });
const wordsKnown = i => memo('wk'+i, () => { const kn = knownAt(i); return WORDS.filter(w => w.keys.every(k => kn.has(k))); });
const sentsFor = i => memo('s'+i, () => { const kn = knownAt(i), cur = new Set(lessonAt(i).keys); return SENTS.filter(s => s.keys.every(k => kn.has(k)) && s.keys.some(k => cur.has(k))); });
const decodable = (w, i) => { const kn = knownAt(i); return tokenize(w).every(t => kn.has(t.k)); };

/* pronunciación de sílabas sueltas para la voz */
/* Las voces del sistema deletrean algunas sílabas sueltas (fla → «efe ele a») y la tilde
   solo arregla algunas (flá, jú) y estropea otras (mó, jó, plé). Por eso la sílaba se envía tal cual,
   salvo las que se ha comprobado que mejoran. Para el resto, lo seguro es grabar la voz del maestro. */
/* Formas comprobadas por el maestro con la voz: así se leen como sílaba española */
const SAY_FIX = {ha:'a',he:'e',hi:'i',ho:'o',hu:'u',ju:'jú',fla:'flá',
  il:'Híl',ol:'Hól',ul:'hul',em:'Hém',us:'Hús',ix:'hix',we:'wé',je:'ge',ji:'gi',
  lle:'ye',lli:'yi',llo:'yo',llu:'yu',to:'Tó',so:'só',go:'Gó',be:'bé'};
function sayAuto(s){
  const p = plain(s);
  if (SAY_FIX[p]) return SAY_FIX[p];
  /* trabadas acabadas en a o u: con tilde se leen bien (flá); sin ella se deletrean */
  if (/^[bcdfgkpt][lr][au]$/.test(p)) return p.replace(/a$/, 'á').replace(/u$/, 'ú');
  return s.toLowerCase().replace(/^rr/, 'r');
}
const sayable = s => (S.settings.pron && S.settings.pron[plain(s)]) || sayAuto(s);

/* sonido aproximado (para no poner dos opciones que suenan igual) */
function phon(s){
  s = plain(s);
  return s.replace(/rr/g,'R').replace(/^r/,'R').replace(/qu/g,'k').replace(/c(?=[aou])/g,'k').replace(/gu(?=[ei])/g,'g')
    .replace(/g(?=[ei])/g,'j').replace(/c(?=[ei])/g,'z').replace(/v/g,'b').replace(/h/g,'').replace(/ll/g,'y').replace(/gü/g,'gu');
}
function sylDistract(i, exclude, n){
  const exP = new Set(exclude.map(plain)), exS = new Set(exclude.map(phon));
  const ok = s => !exP.has(plain(s)) && !exS.has(phon(s));
  const out = [], seen = new Set();
  const add = list => { for (const s of list){ if (out.length >= n) break; if (ok(s) && !seen.has(phon(s))){ out.push(s); seen.add(phon(s)); } } };
  add(shuffle(lessonAt(i).sil.flat()));
  add(shuffle(order().slice(0, i).filter(l => !l.vowel).flatMap(l => l.sil[0])));
  add(shuffle(['a','e','i','o','u']));
  return out;
}
const UNIT_SHOW = {ce:'c', ge:'g', TL:'l', TR:'r'};
function letterDistract(i, parts, n){
  const have = new Set(parts.map(plain));
  const known = [...knownAt(i)].map(k => UNIT_SHOW[k] || k).filter(k => !have.has(k));
  const conf = parts.flatMap(p => CONF[plain(p)] || []).filter(k => known.includes(k));
  return [...new Set([...shuffle(conf), ...shuffle(known)])].slice(0, n);
}
const CONF = {p:['b','d','q'],b:['d','p'],d:['b','p'],m:['n'],n:['m','ñ'],ñ:['n'],l:['ll','t'],ll:['l','y'],t:['d','l'],s:['z','c'],z:['s','c'],c:['qu','z','s'],
  qu:['c','k'],r:['rr'],rr:['r'],f:['t'],v:['b'],y:['ll','i'],j:['g'],g:['j','gu'],h:[],ch:['c','ll'],x:['s'],k:['c','qu'],w:['u','v']};
const HUNT_CONF = {p:['q','b','d'],b:['d','p','h'],d:['b','p','q'],m:['n','u','w'],n:['m','u','h'],u:['n','v'],l:['t','f','i'],t:['l','f'],f:['t','l'],
  s:['z','c'],z:['s','c'],e:['a','o','c'],a:['o','e','d'],o:['a','e','c'],i:['l','j','t'],v:['b','u','w'],j:['i','g','y'],g:['q','j','p'],h:['n','b','k'],
  ñ:['n','m'],y:['v','j','g'],x:['k','z'],k:['h','x'],w:['v','m','u'],r:['n','v','s']};

/* ================== AUDIOS PREGRABADOS ==================
   Muchos Chromebook no traen voces en español ni en árabe. La app usa audios ya grabados
   (carpeta audio/, generada con generar_audios.pyw) y solo si falta alguno recurre a la voz del sistema.
   Los audios van en paquetes: se descargan al necesitarlos y el service worker los guarda para usarlos sin conexión. */
const AUD = {
  base: './audio/', idx: null, packs: [], urls: new Map(), ready: null, pending: false, BASE_RATE: 0.8,
  MISS: 'letraALetra_faltan',
  key: t => String(t).normalize('NFC').replace(/\s+/g, ' ').trim().toLocaleLowerCase('es'),
  load(){
    if (this.ready) return this.ready;
    this.pending = true;
    return (this.ready = fetch(this.base + 'indice.json', {cache: 'no-cache'})
      .then(r => r.ok ? r.json() : null)
      .then(j => { if (j && j.c && j.packs){ this.idx = j; this.prefetch(); } return this.idx; })
      .catch(() => null)
      .finally(() => { this.pending = false; }));
  },
  on(){ return !!this.idx && S.settings.clips !== false; },
  count(lang){ if (!this.idx) return 0; const p = lang + '|'; return Object.keys(this.idx.c).filter(k => k.startsWith(p)).length; },
  has(k){ return this.on() && !!this.idx.c[k]; },
  /* frases que se montan con dos audios: «¿Cómo empieza» + «papá» */
  SPLIT: [
    [/^(¿Con qué vocal empieza|¿Cómo empieza|¿Qué sílaba oyes en) (.+)\?$/, m => [m[1], m[2]]],
    [/^(Forma la palabra:|Escribe la palabra:) (.+)$/, m => [m[1], m[2]]]
  ],
  parts(text, lang){
    if (!this.on() || !text) return null;
    const k = lang + '|' + this.key(text);
    if (this.has(k)) return [k];
    if (lang !== 'es') return null;
    for (const [re, f] of this.SPLIT){
      const m = String(text).trim().match(re);
      if (m){ const ks = f(m).map(t => 'es|' + this.key(t)); if (ks.every(x => this.has(x))) return ks; }
    }
    return null;
  },
  pack(i){
    if (!this.packs[i]) this.packs[i] = fetch(this.base + this.idx.packs[i])
      .then(r => { if (!r.ok) throw new Error('paquete'); return r.arrayBuffer(); })
      .catch(e => { this.packs[i] = null; throw e; });
    return this.packs[i];
  },
  async url(k){
    if (this.urls.has(k)) return this.urls.get(k);
    const [p, o, n] = this.idx.c[k];
    const buf = await this.pack(p);
    const u = URL.createObjectURL(new Blob([buf.slice(o, o + n)], {type: 'audio/mpeg'}));
    this.urls.set(k, u);
    return u;
  },
  /* descarga en segundo plano el resto de paquetes, de uno en uno, para que luego funcione sin conexión */
  prefetch(){
    let i = 0;
    const next = () => { if (!this.idx || i >= this.idx.packs.length) return; this.pack(i++).then(() => setTimeout(next, 800), () => setTimeout(next, 8000)); };
    setTimeout(next, 5000);
  },
  /* reproduce una o varias piezas seguidas; devuelve false si no ha podido (entonces se usa la voz del sistema) */
  async play(ks, rate, alive){
    if (TTS.has) try { if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); } catch(e){}
    for (const k of ks){
      let u;
      try { u = await Promise.race([this.url(k), new Promise((_, rej) => setTimeout(() => rej(new Error('lento')), 9000))]); }
      catch(e){ return false; }
      if (!alive()) return true;
      await new Promise(res => {
        const au = new Audio(u);
        au.preservesPitch = true;
        au.playbackRate = Math.min(2, Math.max(.5, (rate || S.settings.rate) / this.BASE_RATE));
        if (curAudio) curAudio.pause();
        curAudio = au;
        const t = setTimeout(() => fin(), 20000);
        const fin = () => { clearTimeout(t); if (curAudio === au) curAudio = null; res(); };
        au.onended = fin; au.onerror = fin; au.onpause = fin;
        au.play().catch(fin);
      });
      if (!alive()) return true;
    }
    return true;
  },
  /* apunta las frases que no tienen audio, para poder generarlas después */
  note(text, lang){
    try {
      const t = String(text).replace(/\s+/g, ' ').trim(); if (!t) return;
      const list = JSON.parse(localStorage.getItem(this.MISS) || '[]');
      if (list.includes(t) || list.length >= 500) return;
      list.push(t); localStorage.setItem(this.MISS, JSON.stringify(list));
    } catch(e){}
  },
  missing(){ try { return JSON.parse(localStorage.getItem(this.MISS) || '[]'); } catch(e){ return []; } },
  clearMissing(){ try { localStorage.removeItem(this.MISS); } catch(e){} }
};
AUD.load();

/* ================== VOZ (TTS) ================== */
const TTS = {
  voice:null, seq:0, has: 'speechSynthesis' in window,
  list(){ if (!this.has) return []; return speechSynthesis.getVoices().filter(v => /^es([-_]|$)/i.test(v.lang)); },
  pick(){
    const es = this.list(); let v = null;
    if (S.settings.voice) v = es.find(x => x.voiceURI === S.settings.voice) || null;
    if (!v) v = es.find(x => /es[-_]ES/i.test(x.lang) && /google/i.test(x.name)) || es.find(x => /es[-_]ES/i.test(x.lang)) || es[0] || null;
    this.voice = v;
    return es;
  },
  /* Android: cancel() es asíncrono y puede borrar la frase que se pide justo después;
     las voces cambian de objeto al recargarse; «es_ES» no es un código válido. Se tienen en cuenta aquí. */
  android: /android/i.test(navigator.userAgent), lastErr: '', _u: null,
  fresh(v){ if (!v) return null; return speechSynthesis.getVoices().find(x => x.voiceURI === v.voiceURI) || null; },
  speak(text, o = {}){
    if (S.settings.muted){ if (!o.keep) this.seq++; return sleep(text ? Math.min(1400, 250 + text.length * 25) : 0); }
    if (!o.keep){ this.seq++; if (curAudio){ curAudio.pause(); curAudio = null; } }
    const my = this.seq;
    const go = () => {
      if (this.seq !== my) return;
      const lang = o.ar ? 'ar' : 'es', ks = AUD.parts(text, lang);
      if (ks) return AUD.play(ks, o.ar ? S.settings.rate : o.rate, () => this.seq === my).then(ok => { if (!ok && this.seq === my) return this._tts(text, o); });
      if (text && AUD.on()) AUD.note(text, lang);
      return this._tts(text, o);
    };
    return AUD.pending ? Promise.race([AUD.ready, sleep(3000)]).then(go) : go();
  },
  /* voz del sistema (respaldo) */
  _tts(text, o = {}){
    return new Promise(res => {
      if (!this.has || !text || (o.ar && !o.voice)){ res(); return; }
      if (!this.voice) this.pick();
      const busy = speechSynthesis.speaking || speechSynthesis.pending;
      if (busy) try { speechSynthesis.cancel(); } catch(e){}
      let done = false, to = null, retried = false;
      const fin = () => { if (done) return; done = true; clearTimeout(to); res(); };
      const rate = o.rate || S.settings.rate;
      const go = useVoice => {
        const u = new SpeechSynthesisUtterance(text);
        const v = useVoice ? this.fresh(o.voice || this.voice) : null;
        const lang = ((v && v.lang) || (o.voice ? o.voice.lang : 'es-ES')).replace('_', '-');
        u.lang = lang; if (v) u.voice = v;
        u.rate = rate; u.pitch = 1.05;
        u.onend = fin;
        u.onerror = e => {
          this.lastErr = (e && e.error) || 'error';
          /* si falla con la voz elegida, se reintenta una vez con la voz por defecto del idioma */
          if (!retried && v && this.lastErr !== 'interrupted' && this.lastErr !== 'canceled'){ retried = true; setTimeout(() => go(false), 60); return; }
          fin();
        };
        this._u = u; /* evita que el navegador la descarte antes de terminar */
        try { if (!this.android && speechSynthesis.paused) speechSynthesis.resume(); speechSynthesis.speak(u); } catch(e){ fin(); }
      };
      to = setTimeout(fin, 2500 + text.length * 170 / rate);
      setTimeout(() => go(true), busy ? (this.android ? 250 : 60) : 0);
    });
  },
  stop(){ this.seq++; if (curAudio){ curAudio.pause(); curAudio = null; } if (this.has) try { speechSynthesis.cancel(); } catch(e){} }
};
if (TTS.has){ TTS.pick(); speechSynthesis.onvoiceschanged = () => { TTS.pick(); if (screenId === 'teacher' && tTab === 'voz') renderTeacher(); }; }
document.addEventListener('visibilitychange', () => { if (document.hidden) TTS.stop(); });

/* ================== GRABACIONES DEL MAESTRO ==================
   La voz del sistema no siempre lee bien una sílaba suelta. Si el maestro graba su voz,
   la app usa esa grabación. Se guardan en IndexedDB y viajan en la copia de seguridad. */
const REC = new Map();
let curAudio = null;
const RecDB = {
  db: null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej('sin IndexedDB');
      const r = indexedDB.open('letraALetraESAudio', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('rec');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('rec', mode); fn(t.objectStore('rec')); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  put(k, b){ return this.run('readwrite', st => st.put(b, k)); },
  del(k){ return this.run('readwrite', st => st.delete(k)); },
  clear(){ return this.run('readwrite', st => st.clear()); },
  async all(){ const out = {}; await this.run('readonly', st => { const c = st.openCursor(); c.onsuccess = () => { const cur = c.result; if (cur){ out[cur.key] = cur.value; cur.continue(); } }; }); return out; }
};
async function loadRecs(){
  try { const all = await RecDB.all(); REC.forEach(u => URL.revokeObjectURL(u)); REC.clear(); Object.entries(all).forEach(([k, b]) => REC.set(k, URL.createObjectURL(b))); } catch(e){}
}
function playURL(url){
  return new Promise(res => {
    const au = new Audio(url); curAudio = au;
    const fin = () => { if (curAudio === au) curAudio = null; res(); };
    au.onended = fin; au.onerror = fin; au.onpause = fin;
    au.play().catch(fin);
  });
}
/* reproduce una sílaba: grabación del maestro si existe; si no, voz del sistema */
function speakSyl(s, o = {}){
  if (S.settings.muted) return sleep(350);
  const k = plain(s);
  if (REC.has(k)){ if (!o.keep) TTS.stop(); return playURL(REC.get(k)); }
  return TTS.speak(sayable(s), o);
}

/* ================== EFECTOS DE SONIDO ================== */
const FX = {
  ctx:null,
  init(){ if (!this.ctx){ try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, d, type='triangle', vol=.14, when=0){
    if (!S.settings.fx || S.settings.muted || !this.ctx) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .02);
  },
  ok(){ this.tone(660,.12); this.tone(990,.2,'triangle',.14,.1); },
  bad(){ this.tone(200,.22,'square',.05); },
  tap(){ this.tone(880,.05,'sine',.05); },
  win(){ [523,659,784,1047].forEach((f,i) => this.tone(f,.22,'triangle',.13,i*.12)); }
};
document.addEventListener('pointerdown', () => FX.init(), {once:true});

function modal({title, html='', buttons=[{label:'Aceptar', cls:'primary', value:true}], onMount}){
  return new Promise(res => {
    const back = document.createElement('div'); back.className = 'modal-back';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3></h3><div class="mbody">${html}</div><div class="row"></div></div>`;
    back.querySelector('h3').textContent = title;
    const row = back.querySelector('.row');
    const close = v => { back.remove(); res(v); };
    buttons.forEach(b => {
      const el = document.createElement('button'); el.className = 'btn ' + (b.cls || ''); el.textContent = b.label;
      el.onclick = () => { if (b.check && !b.check(back)) return; close(typeof b.value === 'function' ? b.value(back) : b.value); };
      row.appendChild(el);
    });
    $('#modal-root').appendChild(back);
    if (onMount) onMount(back, close);
  });
}

function burst(n){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const b = document.createElement('div'); b.className = 'burst';
  for (let k = 0; k < 14 + n*6; k++){
    const s = document.createElement('span'); s.textContent = pick(['⭐','✨','🌟','🎉']);
    s.style.left = Math.random()*100 + 'vw'; s.style.animationDuration = (1.8 + Math.random()*1.6) + 's'; s.style.animationDelay = Math.random()*.6 + 's';
    b.appendChild(s);
  }
  document.body.appendChild(b); setTimeout(() => b.remove(), 4300);
}

/* ================== PINTAR PALABRAS ================== */
function wordHTML(w, curKeys = [], sylc = false){
  const units = tokenize(w), syl = syllabify(w);
  const u2 = x => curKeys.includes(x.k) ? `<span class="nl">${esc(x.t)}</span>` : esc(x.t);
  if (!sylc) return units.map(u2).join('');
  return syl.map((s, si) => `<span class="${si % 2 ? 'sy2' : 'sy1'}">${units.slice(s.a, s.b).map(u2).join('')}</span>`).join('');
}
const sylHTML = s => tokenize(s).map(u => u.v && s.length > 1 ? esc(u.t) : `<span class="nl">${esc(u.t)}</span>`).join('');
function bigLetter(l, anim){
  const w = anim ? 'write-in' : '';
  if (isMay()){ const t = (l.id === 'TL' || l.id === 'TR') ? `${l.show} ${l.up}` : l.id === 'gü' ? 'güe güi' : l.id === 'ge' ? 'ge gi' : l.up; return `<span class="${w}" style="font-size:${t.length > 6 ? '.4em' : t.length > 2 ? '.7em' : '1em'}">${esc(t)}</span>`; }
  if (l.id === 'TL' || l.id === 'TR') return `<span class="${w}" style="font-size:.4em">${esc(l.show)} ${esc(l.up)}</span>`;
  if (l.id === 'ge' || l.id === 'gü') return `<span class="${w}" style="font-size:.7em">${esc(l.id === 'gü' ? 'güe güi' : l.show)}</span>`;
  return `<span class="${w}">${esc(l.show)}<span class="up"> ${esc(l.up)}</span></span>`;
}
function lessonTitle(l){
  if (l.vowel) return 'La vocal ' + l.show;
  if (l.id === 'TL' || l.id === 'TR') return 'Las ' + l.name;
  if (l.id === 'ge') return 'La ge suave: ge, gi';
  if (l.id === 'gü') return 'Güe, güi';
  if (l.id === 'r') return 'La ere suave';
  return 'La ' + l.name;
}
function introText(l){
  if (l.intro) return l.intro;
  if (l.vowel) return `Esta es la ${l.name}. ${cap(l.name)} de ${l.clave[0]}.`;
  return `Esta es la ${l.name}. ${cap(l.name)} de ${l.clave[0]}.`;
}

/* ================== ACTIVIDADES DISPONIBLES ================== */
const ACT_LIST = ['conoce','traza','caza','escucha','empieza','lee','forma','dicta','ordena','comprende','cartilla'];
const ACTS = {
  conoce:{ic:'👀', lb:'Conoce la letra'}, traza:{ic:'✏️', lb:'Traza'}, caza:{ic:'🔎', lb:'Caza letras'},
  escucha:{ic:'👂', lb:'Escucha y elige'}, empieza:{ic:'🖼️', lb:'¿Cómo empieza?'}, lee:{ic:'🔗', lb:'Lee y une'},
  forma:{ic:'🧩', lb:'Forma la palabra'}, dicta:{ic:'✍️', lb:'Escribe la palabra'}, ordena:{ic:'🔀', lb:'Ordeno la frase'},
  comprende:{ic:'💡', lb:'Leo y comprendo'}, cartilla:{ic:'📕', lb:'Cartilla'}
};
const EMO = WORDS.filter(w => w.e && !w.name);
/* sílabas de la misma letra, sin repetir sonido */
function sameLetter(l, exclude = []){
  const exP = new Set(exclude.map(plain)), seen = new Set(), out = [];
  const src = l.vowel ? ['a','e','i','o','u'] : l.sil.flat();
  src.forEach(s => { const ph = phon(s); if (!exP.has(plain(s)) && !seen.has(ph)){ seen.add(ph); out.push(s); } });
  return out;
}
function optionSet(l, target, exclude = [], max = 6){
  const others = shuffle(sameLetter(l, [target, ...exclude]).filter(s => phon(s) !== phon(target))).slice(0, max - 1);
  return shuffle([target, ...others]);
}
/* por cada sílaba: dibujos que empiezan por ella; si no hay, dibujos que la contienen */
function poolEmpieza(i){
  return memo('emp' + i, () => {
    const l = lessonAt(i);
    if (l.vowel){ const ws = EMO.filter(w => plain(w.w)[0] === l.id).map(w => ({w, ans: l.id, mode: 'vowel'})); return {groups: ws.length ? [ws] : [], words: ws}; }
    const groups = [];
    sameLetter(l).forEach(sy => {
      const m = s => phon(s.t) === phon(sy) && s.k.some(k => l.keys.includes(k));
      let g = EMO.filter(w => m(w.syl[0])).map(w => ({w, ans: sy, mode: 'first'}));
      if (!g.length) g = EMO.filter(w => w.syl.slice(1).some(m)).map(w => ({w, ans: sy, mode: 'any'}));
      if (g.length) groups.push(g);
    });
    return {groups, words: groups.flat()};
  });
}
/* reparte las rondas entre todas las sílabas: primero una de cada, sin repetir dibujo */
function roundRobin(groups, n){
  const gs = shuffle(groups.map(g => shuffle(g))), out = [], used = new Set();
  let guard = 0;
  while (out.length < n && guard++ < 200){
    let added = false;
    for (const g of gs){
      if (out.length >= n) break;
      const it = g.find(x => !used.has(x.w.w));
      if (it){ out.push(it); used.add(it.w.w); added = true; }
    }
    if (!added) break;
  }
  return out;
}
const poolLee = i => wordsFor(i).filter(w => w.e && !w.name);
function poolForma(i){ const p = wordsFor(i).filter(w => !w.name && w.syl.length >= 2); const e = p.filter(w => w.e); return e.length >= 3 ? e : p; }
function poolDicta(i){ const p = wordsFor(i).filter(w => !w.name && w.units.length >= 2 && w.units.length <= 7); const e = p.filter(w => w.e); return e.length >= 3 ? e : p; }
/* frases que ya se pueden leer, con un solo dibujo claro (para «Leo y comprendo») */
const consUpTo = i => order().slice(0, i + 1).filter(x => !x.vowel).length;
const sentsKnown = i => memo('sk' + i, () => { const kn = knownAt(i); return SENTS.filter(x => x.keys.every(k => kn.has(k))); });
const PICW = {}; WORDS.forEach(w => { if (w.e && !w.name) PICW[w.w] = w; });
const NAMES = new Set(WORDS.filter(w => w.name).map(w => w.w));
function compPool(i){
  return memo('cp' + i, () => {
    const cur = new Set(lessonAt(i).keys), out = [];
    sentsKnown(i).forEach(x => {
      const ws = sentWords(x.s).map((w, k) => k === 0 && !NAMES.has(w) ? w.toLowerCase() : w);
      const pics = [...new Set(ws.filter(w => PICW[w]))];
      if (pics.length === 1) out.push({s: x.s, w: PICW[pics[0]], cur: x.keys.some(k => cur.has(k))});
    });
    return out;
  });
}
/* frases sencillas para ordenar: de 3 a 6 palabras y sin comas ni signos de exclamación o interrogación */
function poolOrdena(i){
  return memo('or' + i, () => {
    const ok = t => /^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]+\.$/.test(t) && sentWords(t).length >= 3 && sentWords(t).length <= 6;
    const cur = sentsFor(i).map(x => x.s).filter(ok);
    const known = sentsKnown(i).map(x => x.s).filter(ok).filter(t => !cur.includes(t));
    return {cur, known};
  });
}
function availableActs(i){
  return memo('acts' + i, () => {
    const l = lessonAt(i);
    return ACT_LIST.filter(a => {
      if (a === 'lee') return !l.vowel && poolLee(i).length >= 2;
      if (a === 'forma') return !l.vowel && poolForma(i).length >= 2;
      if (a === 'dicta') return !l.vowel && poolDicta(i).length >= 2;
      if (a === 'empieza') return poolEmpieza(i).words.length >= 2;
      if (a === 'ordena'){ const o = poolOrdena(i); return !l.vowel && o.cur.length >= 1 && o.cur.length + o.known.length >= 2; }
      if (a === 'comprende') return !l.vowel && consUpTo(i) >= 6 && compPool(i).length >= 4;
      return true;
    });
  });
}
const lessonDone = i => { const l = lessonAt(i); return availableActs(i).every(a => starsOf(l.id, a) > 0); };
/* estrellas de la letra: las del juego con menos estrellas, y solo cuando están todos hechos (no es una media) */
function letterStars(i){ const l = lessonAt(i), acts = availableActs(i); if (!acts.length || !acts.every(a => starsOf(l.id, a) > 0)) return 0; return Math.min(...acts.map(a => starsOf(l.id, a))); }
const MEDAL = ['', 'bronce', 'plata', 'oro'];
const starRow = n => '★'.repeat(n) + `<span class="off">${'★'.repeat(3 - n)}</span>`;
function lessonStars(i){ const l = lessonAt(i), acts = availableActs(i); return {got: acts.reduce((s, a) => s + starsOf(l.id, a), 0), max: acts.length * 3}; }

/* ================== MAPA DE LETRAS ================== */
function renderMap(){
  $('#map-title').textContent = 'Mis letras';
  $('#map-stars').textContent = '⭐ ' + totalStars(P);
  const m = $('#map'); m.innerHTML = '';
  let curEl = null;
  const nDone = order().filter((l, i) => lessonDone(i)).length;
  const top = document.createElement('div'); top.className = 'map-top';
  top.innerHTML = `<button class="btn sun" id="btn-rev">🔁 Repaso</button><button class="btn" id="btn-alb">📒 Mi álbum<span class="alb-n">${nDone}/${order().length}</span></button>`;
  m.appendChild(top);
  top.querySelector('#btn-rev').onclick = () => startReview();
  top.querySelector('#btn-alb').onclick = () => openAlbum();
  const isTrab = l => l.id === 'TL' || l.id === 'TR';
  const secs = [{t:'Vocales', f: l => l.vowel}, {t:'Consonantes', f: l => !l.vowel && !isTrab(l)}, {t:'Trabadas', f: isTrab}];
  const grids = secs.map(sec => {
    const h = document.createElement('h3'); h.className = 'map-h'; h.innerHTML = `<span>${sec.t}</span>`;
    const g = document.createElement('div'); g.className = 'map';
    m.appendChild(h); m.appendChild(g); return g;
  });
  order().forEach((l, i) => {
    const b = document.createElement('button');
    const un = isUnlocked(i), done = lessonDone(i), cur = !P.guest && i === P.unlocked;
    b.className = 'tile' + (un ? '' : ' locked') + (cur ? ' current' : '') + (done ? ' done' : '');
    const label = l.id === 'gü' ? 'güe' : l.show.split(' ')[0];
    const acts = availableActs(i), hechos = acts.filter(a => starsOf(l.id, a) > 0).length, n = letterStars(i);
    b.innerHTML = `<span class="lt ${label.length > 2 ? 'long' : ''}">${esc(label)}</span><span class="ss">${n ? starRow(n) : hechos ? `<span class="prog">${hechos}/${acts.length}</span>` : ''}</span>`;
    b.setAttribute('aria-label', 'Letra ' + l.name + (un ? '' : ', cerrada'));
    b.onclick = () => {
      if (!un){ FX.bad(); instr('Esta letra todavía está cerrada. Termina la anterior.'); return; }
      openLesson(i);
    };
    if (cur) curEl = b;
    grids[secs.findIndex(sec => sec.f(l))].appendChild(b);
  });
  if (curEl) setTimeout(() => curEl.scrollIntoView({block:'center', behavior:'smooth'}), 120);
}
$('#btn-book').onclick = () => openBook(P.guest ? 0 : Math.min(P.unlocked, order().length - 1), false);

  LI = i; const l = lessonAt(i);

$('#btn-lesson-say').onclick = () => speakIntro(lessonAt(LI));

/* ================== MOTOR DE ACTIVIDADES ================== */
let A = null;
const RUN = {};
const alive = a => A === a;
function startAct(id, ctx){
  A = {id, ctx, errors: 0, sayFn: null};
  if (ctx.kind === 'lesson' || ctx.kind === 'review'){ A.i = ctx.i; A.l = lessonAt(ctx.i); LI = ctx.i; }
  go('act');
  $('#stage').innerHTML = ''; $('#dots').innerHTML = '';
  RUN[id](A);
}
$('#btn-act-say').onclick = () => { if (A && A.sayFn) A.sayFn(); };
$('#btn-act-back').onclick = () => { const a = A; A = null; backFrom(a); };
function backFrom(a){ if (!a) return go('map'); if (a.ctx.kind === 'review') return go('map'); openLesson(a.ctx.i); }
function dots(n, cur){ const rv = A && A.ctx && A.ctx.kind === 'review' ? `<span class="rv">🔁 ${A.ctx.step + 1}/${A.ctx.plan.length}</span>` : ''; $('#dots').innerHTML = rv + Array.from({length: n}, (_, k) => `<i class="${k < cur ? 'on' : k === cur ? 'now' : ''}"></i>`).join(''); }
function progKey(a){ return a.l.id; }

/* en el repaso cada actividad tiene solo 2 rondas */
const RL = (a, n) => a.ctx.kind === 'review' ? Math.min(n, 2) : n;
function finish(a, forced){
  if (!alive(a)) return;
  if (a.ctx.kind === 'review') return reviewStep(a);
  const before = a.ctx.kind === 'lesson' ? letterStars(a.i) : 0;
  const st = forced || (a.errors === 0 ? 3 : a.errors <= 2 ? 2 : 1);
  const key = progKey(a);
  P.prog[key] = P.prog[key] || {};
  P.prog[key][a.id] = Math.max(P.prog[key][a.id] || 0, st);
  let unl = false;
  if (a.ctx.kind === 'lesson' && !P.guest && a.i === P.unlocked && a.i < order().length - 1 && lessonDone(a.i)){ P.unlocked++; unl = true; }
  save();
  const after = a.ctx.kind === 'lesson' ? letterStars(a.i) : 0;
  const sticker = after > before ? {l: lessonAt(a.i), n: after, up: before > 0} : null;
  showResult(a, st, unl, sticker);
}
function showResult(a, st, unl, sticker){
  go('result');
  const next = unl ? lessonAt(a.i + 1) : null;
  const msg = st === 3 ? '¡Genial!' : st === 2 ? '¡Muy bien!' : '¡Bien hecho!';
  $('#result').innerHTML = `<div class="stars">${[1,2,3].map(n => `<span class="${n <= st ? 'on' : ''}">⭐</span>`).join('')}</div>
    <h2>${msg}</h2>
    ${unl ? `<div class="unlock">🔓 Nueva letra: <span class="lig" style="color:var(--red);font-size:1.6rem">${esc(next.id === 'gü' ? 'güe' : next.show)}</span></div>` : ''}
    ${sticker ? `<div class="newstk m${sticker.n}"><span class="se">${sticker.l.clave[1]}</span><span class="st">${starRow(sticker.n)}</span><span>🎉 ${sticker.up ? `¡Tu pegatina sube a ${MEDAL[sticker.n]}!` : `¡Nueva pegatina de ${MEDAL[sticker.n]}!`}</span>${sticker.n < 3 ? `<span class="tip">Consigue 3 estrellas en todos los juegos de esta letra para que sea de oro.</span>` : ''}<button class="btn small" id="r-alb">📒 Ver mi álbum</button></div>` : ''}
    <div class="row center" style="margin-top:26px"><button class="btn" id="r-again">🔁 Otra vez</button><button class="btn primary" id="r-go">Seguir ➡️</button></div>`;
  FX.win(); burst(st);
  instr(`${msg} Has ganado ${['', 'una estrella', 'dos estrellas', 'tres estrellas'][st]}.` + (unl ? ` ¡Ya puedes aprender una letra nueva!` : '') + (sticker ? (sticker.up ? ` ¡Tu pegatina sube a ${MEDAL[sticker.n]}!` : ` ¡Y una pegatina de ${MEDAL[sticker.n]} para tu álbum!`) + (sticker.n < 3 ? ' Consigue tres estrellas en todos los juegos para que sea de oro.' : '') : ''));
  $('#r-again').onclick = () => a.id === 'repaso' ? startReview() : a.id === 'cartilla' ? openBook(a.i, true) : startAct(a.id, a.ctx);
  const ra = $('#r-alb'); if (ra) ra.onclick = () => openAlbum();
  $('#r-go').onclick = () => backFrom(a);
}

const PRAISE = ['¡Muy bien!', '¡Genial!', '¡Eso es!', '¡Estupendo!', '¡Fenomenal!'];
async function praise(){ FX.ok(); await TTS.speak(pick(PRAISE)); }

/* botones de opciones reutilizables */
function makeOpts(a, box, items, {render, isOk, onOk, onBad, emo = false}){
  let wrongs = 0, locked = false;
  const btns = items.map(it => {
    const b = document.createElement('button');
    b.className = 'opt' + (emo ? ' emo' : '');
    b.innerHTML = `<span>${render(it)}</span>`;
    b.onclick = async () => {
      if (locked || b.disabled) return;
      if (isOk(it)){
        locked = true; b.classList.add('ok'); btns.forEach(x => x.disabled = true);
        await onOk(it, b);
      } else {
        b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); b.disabled = true;
        a.errors++; wrongs++; FX.bad();
        if (wrongs >= 2){ const good = btns[items.findIndex(isOk)]; if (good) good.classList.add('hint'); }
        if (onBad) onBad(wrongs);
      }
    };
    box.appendChild(b); return b;
  });
  return btns;
}

/* ---------- 1. CONOCE LA LETRA (recorrido guiado) ---------- */
RUN.conoce = a => {
  const l = a.l, st = $('#stage'), kw = l.clave[0];
  const single = !isMay() && !['TL','TR','ge','gü'].includes(l.id);
  /* las sílabas se barajan cada vez: primero las directas y después las inversas */
  const rows = l.vowel ? [] : l.sil.map(mix), invRow = l.inv ? mix(l.inv) : null;
  const steps = [];
  steps.push({id:'let', say: l.vowel ? `Esta es la ${l.name}.` : `Esta es la ${l.name}.`});
  if (single) steps.push({id:'up', say: `Esta es la ${l.name} mayúscula.`});
  steps.push({id:'key', say: `${cap(l.vowel ? l.name : l.name)} de ${kw}.`});
  if (l.vowel) shuffle(poolEmpieza(a.i).words).filter(x => x.w.w !== kw).slice(0, 3).forEach(({w}) => steps.push({id:'w:' + w.w, pic: w.e, word: w.w, say: w.w}));
  else {
    rows.flat().forEach(s => steps.push({id:'s:' + s, syl: s}));
    if (invRow) invRow.forEach(s => steps.push({id:'i:' + s, syl: s, inv: true}));
  }

  const joinHTML = s => { const u = tokenize(s); const c = u.filter(x => !x.v).map(x => x.t).join(''), v = u.filter(x => x.v).map(x => x.t).join('');
    return u[0].v ? `<span class="v">${esc(v)}</span><span class="plus">+</span><span class="nl">${esc(c)}</span>` : `<span class="nl">${esc(c)}</span><span class="plus">+</span><span class="v">${esc(v)}</span>`; };
  const letterBtn = single
    ? `<button class="big-letter" data-step="let"><span class="write-in">${esc(l.show)}</span></button><button class="big-letter up-b" data-step="up"><span class="write-in up">${esc(l.up)}</span></button>`
    : `<button class="big-letter" data-step="let">${bigLetter(l, true)}</button>`;
  st.innerHTML = `<p class="prompt" id="c-prompt">Toca lo que brilla</p>
    <div class="row center" style="gap:6px">${letterBtn}</div>
    <button class="key-card" data-step="key"><span class="em">${l.clave[1]}</span>${decodable(kw, a.i) ? `<span class="kw">${wordHTML(kw, l.keys)}</span>` : ''}</button>
    ${l.vowel
      ? `<div class="syl-row">${steps.filter(x => x.pic).map(x => `<button class="syl" style="font-family:var(--ui);font-size:3rem" data-step="${esc(x.id)}">${x.pic}</button>`).join('')}</div>`
      : rows.map(row => `<div class="syl-row">${row.map(s => `<button class="syl" data-step="${esc('s:' + s)}">${sylHTML(s)}</button>`).join('')}</div>`).join('')
        + (invRow ? `<div class="syl-row">${invRow.map(s => `<button class="syl inv" data-step="${esc('i:' + s)}">${sylHTML(s)}</button>`).join('')}</div>` : '')}
    <div id="c-done"></div>`;
  const el = id => st.querySelector(`[data-step="${CSS.escape(id)}"]`);
  const heard = new Set();
  const nextStep = () => steps.find(x => !heard.has(x.id));
  const glow = () => {
    st.querySelectorAll('.next').forEach(x => x.classList.remove('next'));
    const n = nextStep(); if (n){ const e = el(n.id); if (e){ e.classList.add('next'); e.scrollIntoView({block:'nearest', behavior:'smooth'}); } }
    dots(steps.length, heard.size);
  };
  const done = async () => {
    a.done = true; st.querySelectorAll('.next').forEach(x => x.classList.remove('next'));
    FX.win(); burst(2);
    $('#c-done').innerHTML = `<div class="done-banner">✅ ¡Muy bien! Ya conoces ${l.vowel ? 'la ' + l.name : 'la ' + l.name}</div>`;
    $('#c-done').scrollIntoView({block:'center', behavior:'smooth'});
    await instr(`¡Muy bien! Ya conoces la ${l.name}.`);
    if (alive(a)) finish(a, 3);
  };
  steps.forEach(stp => {
    const e = el(stp.id); if (!e) return;
    e.onclick = async () => {
      if (a.done) return;
      if (a.busy) return;
      a.busy = true;
      e.classList.add('heard'); FX.tap();
      heard.add(stp.id); dots(steps.length, heard.size);
      /* mientras suena, la mano se queda en lo que se ha tocado */
      st.querySelectorAll('.next').forEach(x => x.classList.remove('next'));
      e.classList.add('next');
      if (stp.syl) await speakSyl(stp.syl); else await TTS.speak(stp.say);
      await sleep(250);
      a.busy = false;
      if (!alive(a)) return;
      if (heard.size === steps.length && !a.done) done(); else glow();
    };
  });
  glow();
  a.sayFn = () => { const n = nextStep(); instr(n ? `Vamos a conocer la ${l.name}. Toca lo que brilla.` : `Ya conoces la ${l.name}.`); };
  a.sayFn();
};

/* ---------- 2. TRAZA ---------- */
function fontReady(){ return Promise.race([document.fonts ? document.fonts.load('400 60px ' + FONTS[fmode()].css.split(',')[0]) : Promise.resolve(), sleep(2500)]).catch(() => {}); }
/* punto verde donde empieza el primer trazo de la primera letra */
function startPoint(c, text, fs, FAM, x0, base, xh, W, H){
  const first = [...text][0]; if (!first || first.toLowerCase() === first.toUpperCase()) return null;
  c.clearRect(0, 0, W, H); c.font = `400 ${fs}px ${FAM}`; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillStyle = '#000';
  c.fillText(first, x0, base);
  const d = c.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 120) pts.push([x, y]);
  if (!pts.length) return null;
  const box = ps => { let a = 1e9, b = -1e9, t = 1e9, u = -1e9; for (const [x, y] of ps){ if (x < a) a = x; if (x > b) b = x; if (y < t) t = y; if (y > u) u = y; } return {x0: a, x1: b, y0: t, y1: u}; };
  const near = (tx, ty, ps) => { let best = ps[0], bd = 1e18; for (const q of ps){ const dd = (q[0] - tx) ** 2 + (q[1] - ty) ** 2; if (dd < bd){ bd = dd; best = q; } } return best; };
  const low = first === first.toLowerCase(), L = plain(first.toLowerCase()), bb = box(pts), xTop = base - xh;
  /* reglas por letra: redondas empiezan arriba a la derecha («a las 2»); en ligada, b e h k l r s entran desde la línea de abajo */
  let rule;
  if (!low) rule = 'cgoqs'.includes(L) ? 'round' : 'top';
  else if (fmode() === 'lig') rule = 'acdgoq'.includes(L) ? 'round' : 'behklrs'.includes(L) ? 'left' : 'top';
  else rule = 'acdgoqs'.includes(L) ? 'round' : L === 'e' ? 'emid' : 'top';
  /* sin el punto de la i y la j ni la virgulilla de la ñ */
  const capH = c.measureText('N').actualBoundingBoxAscent || xh * 1.4;
  const skipTop = 'ijñ'.includes(L) ? (low ? xTop - xh * .12 : base - capH - capH * .06) : -1;
  if (skipTop > 0){ const keep = pts.filter(q => q[1] >= skipTop); if (keep.length){ pts.length = 0; for (const q of keep) pts.push(q); } }
  let p;
  if (rule === 'round'){

    const extra = kind === 'forma' ? shuffle(sameLetter(l, parts)).slice(0, 2) : letterDistract(a.i, parts, 3);
    const tiles = shuffle([...parts, ...extra].map((t, ix) => ({t, ix})));

      <div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>`;

      const inS = new Set(sentWords(it.s).map(w => w.toLowerCase())), used = new Set([it.w.e]), dist = [];
      const cand = shuffle(wordsKnown(a.i).filter(x => x.e && !x.name && !inS.has(x.w)));
      [...cand.filter(x => x.w[0] === it.w.w[0]), ...cand, ...shuffle(EMO)].forEach(x => { if (dist.length < 3 && !used.has(x.e) && !inS.has(x.w)){ used.add(x.e); dist.push(x); } });
      st.innerHTML = `<p class="prompt">Lee la frase y toca su dibujo</p>
        <button class="sent-show" id="cm-s" aria-label="Frase">${sentHTML(it.s, l.keys, false)}</button><div class="opts" id="cm-opts"></div>`;
      $('#cm-s').onclick = () => TTS.speak(it.s);
      makeOpts(a, $('#cm-opts'), shuffle([it.w, ...dist]), {emo: true, render: x => x.e, isOk: x => x.w === it.w.w, onOk: done});
      a.sayFn = () => instr('Lee la frase y toca su dibujo.');
    } else {
      /* mira el dibujo y toca la frase que lo dice */
      const dist = [], es = new Set([it.w.e]);
      shuffle(pool.filter(x => x.s !== it.s)).forEach(x => { if (dist.length < 2 && !es.has(x.w.e)){ es.add(x.w.e); dist.push(x); } });
      st.innerHTML = `<p class="prompt">Mira el dibujo y toca la frase que lo dice</p>
        <div class="pic" aria-hidden="true">${it.w.e}</div><div class="sent-opts" id="cm-opts"></div>`;
      makeOpts(a, $('#cm-opts'), shuffle([it, ...dist]), {render: x => sentHTML(x.s, l.keys, false), isOk: x => x.s === it.s, onOk: done});
      a.sayFn = () => instr('Mira el dibujo y toca la frase que lo dice.');
    }
    if (k < 2) a.sayFn();
  };
  round();
};

/* ================== GRABARSE LEYENDO ================== */
/* las grabaciones del niño solo se guardan mientras la app está abierta */
const MYREC = {};
let recBusy = false;
async function recReading(btn, key, text, playBtn){
  if (recBusy) return;
  if (S.settings.muted){ toast('Activa el sonido para grabarte y escucharte'); return; }
  TTS.stop(); FX.init();
  const stream = await getMic(); if (!stream) return;
  recBusy = true; btn.textContent = '⏹'; btn.classList.add('recording');
  toast('Grabando… lee la frase y pulsa ⏹ al terminar');
  const blob = await recordClip(stream, 12000, btn);
  releaseMic(); recBusy = false;
  btn.textContent = '🎙️'; btn.classList.remove('recording');
  btn.onclick = () => recReading(btn, key, text, playBtn);
  if (MYREC[key]) URL.revokeObjectURL(MYREC[key]);
  MYREC[key] = URL.createObjectURL(blob);
  if (playBtn) playBtn.classList.remove('hidden');
  await playURL(MYREC[key]); await sleep(400);
  await TTS.speak(text);
}

/* ================== REPASO ================== */
const REV_ACTS = ['escucha','empieza','lee','forma','dicta','ordena','comprende','caza'];
function startReview(){
  const learned = order().map((l, i) => i).filter(i => lessonStars(i).got > 0);
  if (learned.length < 2){ toast('Para repasar, primero trabaja al menos dos letras'); instr('Para repasar, primero trabaja al menos dos letras.'); return; }
  const plan = [], used = new Set();
  for (let n = 0; n < 6; n++){
    let j, act, g = 0;
    do { j = pick(learned); act = pick(availableActs(j).filter(x => REV_ACTS.includes(x))); g++; } while ((!act || used.has(j + act) || (plan.length && plan[plan.length - 1].act === act)) && g < 60);
    if (!act) continue;
    used.add(j + act); plan.push({j, act});
  }
  if (!plan.length){ toast('Todavía no hay actividades para repasar'); return; }
  const ctx = {kind: 'review', plan, step: 0, errors: 0, i: plan[0].j};
  startAct(plan[0].act, ctx);
}
function reviewStep(a){
  const c = a.ctx; c.errors += a.errors; c.step++;
  if (c.step < c.plan.length){ c.i = c.plan[c.step].j; FX.ok(); startAct(c.plan[c.step].act, c); return; }
  const st = c.errors === 0 ? 3 : c.errors <= 3 ? 2 : 1;
  P.prog.repaso = P.prog.repaso || {}; P.prog.repaso.best = Math.max(P.prog.repaso.best || 0, st); save();
  showResult({id: 'repaso', ctx: c, i: 0}, st, false, null);
}

    $('#t-prows').querySelectorAll('input').forEach(i => i.onchange = () => { const v = i.value.trim(); if (v) S.settings.pron[i.dataset.p] = v; else delete S.settings.pron[i.dataset.p]; save(); toast('Pronunciación guardada'); });

/* ---------- grabar sílabas ---------- */
let MIC = null;
async function getMic(){
  if (!navigator.mediaDevices || !window.MediaRecorder){ toast('Este navegador no permite grabar'); return null; }
  try { MIC = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}}); return MIC; }
  catch(e){ toast('Permite el uso del micrófono para grabar'); return null; }
}
function releaseMic(){ if (MIC){ MIC.getTracks().forEach(t => t.stop()); MIC = null; } }
function recordClip(stream, ms, btn){
  return new Promise(res => {
    const mr = new MediaRecorder(stream), chunks = [];
    mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mr.onstop = () => res(new Blob(chunks, {type: mr.mimeType || 'audio/webm'}));
    mr.start();
    const t = setTimeout(() => { if (mr.state === 'recording') mr.stop(); }, ms);
    if (btn) btn.onclick = () => { clearTimeout(t); if (mr.state === 'recording') mr.stop(); };
  });
}
async function saveRec(k, blob){
  await RecDB.put(k, blob);
  if (REC.has(k)) URL.revokeObjectURL(REC.get(k));
  REC.set(k, URL.createObjectURL(blob));
}
async function recordOne(k, btn, after){
  TTS.stop(); FX.init();
  const st = await getMic(); if (!st) return;
  btn.textContent = '⏹'; btn.style.background = '#FDE3E6'; btn.style.borderColor = 'var(--red)';
  toast('Grabando… di la sílaba (se para sola en 2,5 s)');
  const blob = await recordClip(st, 2500, btn);
  releaseMic(); await saveRec(k, blob);
  after(); toast('Grabación guardada'); playURL(REC.get(k));
}
async function recordAll(list, after){
  TTS.stop(); FX.init();
  const st = await getMic(); if (!st) return;
  const back = document.createElement('div'); back.className = 'modal-back';
  back.innerHTML = `<div class="modal" style="text-align:center"><h3>Grabando sílabas</h3><p style="color:var(--soft);margin:0">Di cada sílaba cuando aparezca en rojo.</p>
    <div class="lig" id="rc-s" style="font-size:5rem;line-height:1.8;color:var(--red)"></div><p id="rc-n" style="color:var(--soft)"></p>
    <div class="row center"><button class="btn danger" id="rc-x">Parar</button></div></div>`;
  document.body.appendChild(back);
  let stop = false; back.querySelector('#rc-x').onclick = () => { stop = true; };
  for (let j = 0; j < list.length && !stop; j++){
    const s = list[j];
    back.querySelector('#rc-s').textContent = s; back.querySelector('#rc-s').style.opacity = .35;
    back.querySelector('#rc-n').textContent = `${j + 1} de ${list.length}`;
    await sleep(700); if (stop) break;
    FX.tap(); back.querySelector('#rc-s').style.opacity = 1;
    await sleep(150);
    const blob = await recordClip(st, 1800);
    await saveRec(plain(s), blob);
  }
  releaseMic(); back.remove(); after(); toast('Grabaciones guardadas');
}

let installEvt = null;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function updateInstallBtn(){
  const b = $('#btn-install'); if (!b) return;
  b.classList.toggle('hidden', standalone() || !(installEvt || isIOS()));
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; updateInstallBtn(); });
window.addEventListener('appinstalled', () => { installEvt = null; updateInstallBtn(); toast('App instalada. Ábrela desde el escritorio o el menú de aplicaciones.'); });
$('#btn-install').onclick = async () => {
  if (installEvt){ installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; updateInstallBtn(); return; }
  modal({title: 'Instalar en iPad o iPhone', html: '<p style="margin:0">Abre esta página en <b>Safari</b>, pulsa el botón <b>Compartir</b> (cuadrado con flecha) y elige <b>Añadir a pantalla de inicio</b>.</p>', buttons: [{label: 'Entendido', cls: 'primary', value: true}]});
};
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  /* solo se avisa si ya había una versión instalada (no en la primera visita) */
  const hadCtrl = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl && !reloaded){ reloaded = true; toast('App actualizada a la última versión'); } });
}
updateInstallBtn();

  b.setAttribute('aria-label', off ? 'Activar el sonido' : 'Desactivar el sonido');
  b.setAttribute('aria-pressed', off ? 'true' : 'false');
}

};
